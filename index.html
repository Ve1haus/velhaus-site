<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Velhaus</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <header>
    <img src="velhaus_logo.png" alt="Velhaus Logo" id="logo"/>
  </header>
  <main>
    <section class="hero">
      <div class="animated-bg"></div>
      <h1>Velhaus is a house of ideas</h1>
      <p>Think tank meets build lab.</p>
    </section>
    <section class="projects-grid">
      <div class="project-tile" data-project="rackform">Rackform</div>
      <div class="project-tile" data-project="justprep">JustPrep</div>
      <div class="project-tile" data-project="clay">Clay & Calm</div>
      <div class="project-tile" data-project="snoft">Snoft</div>
      <div class="project-tile" data-project="zipd">Zip’d</div>
    </section>
    <div class="overlay hidden" id="projectOverlay">
      <button id="closeOverlay">×</button>
      <div class="overlay-content">Project details go here...</div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
